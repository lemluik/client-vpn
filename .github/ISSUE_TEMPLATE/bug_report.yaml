name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Copy the log output from the app (if available)
      render: shell

  - type: input
    id: os-version
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: Windows 11, Windows 10, etc.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of КлиентВПН are you using?
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: xray-version
    attributes:
      label: Xray Version
      description: What version of xray.exe are you using?
      placeholder: 26.3.27
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration (sanitized)
      description: |
        If relevant, provide your config.json with sensitive data removed.
        **DO NOT** include private keys, server addresses, or UUIDs.
      placeholder: Paste sanitized config here
      render: json

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
