# CI открытого клиента: анализ, тесты, гейты на каждый push и pull request,
# артефакты и GitHub Release — только на тег. Бесплатные раннеры, кэш pub и Gradle включён.
# Тег с дефисом (репетиция или rc) даёт черновик релиза, который видно только владельцу.
#
# Что здесь сознательно сделано не так, как звучала задача:
# — гейт нейтральности с именами наших узлов и домена в этом репозитории не
#   запускается: сам такой список и был бы утечкой. В CI идёт tools/check_public.py
#   (адреса, секреты, чужие письменности, пути машины разработчика, новые
#   git-идентичности), а именной гейт остаётся локальным перед коммитом;
#   дополнительные шаблоны можно передать секретом NEUTRAL_EXTRA_PATTERNS;
# — тесты с настоящим ядром (test/kernel_config_test.dart) исполняются только в
#   windows-сборке: им нужен assets/xray/xray.exe, на Linux-раннере они пропускаются.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build:
        description: 'Собрать артефакты Windows, Android и macOS с этой ветки'
        type: boolean
        default: false

permissions:
  contents: read

# новый push в ту же ветку отменяет предыдущий прогон — минуты не горят.
# Тег не отменяем: посреди публикации релиза это оставило бы недописанный Release
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  checks:
    name: Анализ, тесты и гейты
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # история нужна, чтобы сравнить авторов коммитов прогона с авторами base
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Гейт публичного репозитория
        env:
          NEUTRAL_EXTRA_PATTERNS: ${{ secrets.NEUTRAL_EXTRA_PATTERNS }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          TAG=""
          case "$GITHUB_REF" in refs/tags/*) TAG="$GITHUB_REF_NAME" ;; esac
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            python tools/check_public.py --commits --base "$BASE" ${TAG:+--tag "$TAG"}
          else
            python tools/check_public.py ${TAG:+--tag "$TAG"}
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # cnativeapi (зависимость tray_manager 0.8.0) компилирует нативный код
      # через pkg-config при pub get; на Linux нужны заголовки GTK3, X11 и Xi
      - name: Нативные зависимости cnativeapi
        run: sudo apt-get update -y && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev

      - name: Строки интерфейса
        run: flutter gen-l10n

      - name: Анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test

  android:
    name: Сборка Android
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # у pull_request github.ref_name равен «№/merge», а слэш имя артефакта
      # не принимает, поэтому для запроса подставляем номер через дефис
      PKG_SUFFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Кэш Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties',
            'android/app/build.gradle.kts', 'android/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Ядро и geo-базы для APK
        run: bash scripts/download_xray_android.sh

      # на раннере 7 ГБ, а в gradle.properties стоит -Xmx8G и MaxMetaspace 4G под
      # рабочую машину: демон не поднимется, поэтому память ограничивается до сборки
      - name: Память Gradle под размер раннера
        run: >-
          sed -i 's/-Xmx8G/-Xmx3G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/'
          android/gradle.properties

      # Релизная подпись: ключ лежит в секретах репозитория и распаковывается во
      # временный каталог раннера — в дерево репозитория он не пишется,
      # android/key.properties в .gitignore. Без секретов (запрос из чужого
      # ответвления) сборка остаётся на отладочном ключе, но релиз по тегу в этом
      # случае не собирается вовсе: следующий шаг его останавливает.
      - name: Ключ подписи релиза
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          umask 077
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s/keystore/release.jks\n' "$RUNNER_TEMP"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Релиз без ключа подписи не собираем
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 == '' }}
        run: |
          echo "::error::Секрета ANDROID_KEYSTORE_BASE64 нет: релизный пакет остался бы на одноразовом отладочном ключе раннера, и обновление поверх него не встанет"
          exit 1

      - name: Сборка APK
        run: flutter build apk --release

      # Пакет с отладочным ключом не даёт обновиться поверх и не принимается
      # магазинами, поэтому подпись проверяется в том же прогоне (Д-202610-20)
      - name: Проверка подписи пакета
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK подписан отладочным ключом, а не релизным"
            exit 1
          fi

      # артефакт магазина обязан нести лицензию и уведомления (пункт У-6),
      # а релиз — контрольную сумму (R1.10)
      - name: Лицензионные файлы и sums
        run: |
          cd build/app/outputs/flutter-apk
          cp "$GITHUB_WORKSPACE/NOTICE" "$GITHUB_WORKSPACE/LICENSE" .
          sha256sum app-release.apk LICENSE NOTICE > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: client-vpn-android-${{ env.PKG_SUFFIX }}
          path: |-
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/LICENSE
            build/app/outputs/flutter-apk/NOTICE
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    name: Сборка Windows и тесты с ядром
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'true')
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PKG_SUFFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Ядро и geo-базы для сборки
        run: bash scripts/download_xray.sh

      # этот же прогон проверяет собранный конфиг настоящим ядром:
      # test/kernel_config_test.dart исполняется только здесь, где есть xray.exe
      - name: Тесты с ядром
        run: flutter test

      - name: Сборка Windows
        run: flutter build windows --release

      - name: Упаковать
        run: |
          cd build/windows/x64/runner/Release
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/NOTICE" .
          7z a -tzip "$GITHUB_WORKSPACE/client-vpn-windows-${PKG_SUFFIX}.zip" .

      - name: Контрольная сумма архива
        run: sha256sum client-vpn-windows-${{ env.PKG_SUFFIX }}.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: client-vpn-windows-${{ env.PKG_SUFFIX }}
          path: |-
            client-vpn-windows-${{ env.PKG_SUFFIX }}.zip
            SHA256SUMS.txt
          if-no-files-found: error

  macos:
    name: Сборка macOS и тесты с ядром
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PKG_SUFFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Universal Xray core (Intel + Apple Silicon) and geo databases into
      # macos/xray/; the script checks every SHA-256 against pinned values.
      - name: Ядро и geo-базы для сборки
        run: bash scripts/download_xray_macos.sh

      # The macOS-only tests run here: the real macOS core validates the built
      # configs, plus the networksetup proxy and the orphaned core guard.
      - name: Тесты с ядром
        run: flutter test

      - name: Сборка macOS
        run: flutter build macos --release

      # Unsigned (ad-hoc) build until there is an Apple Developer account:
      # macOS asks the user to allow it on first launch. The build leaves an
      # invalid ad-hoc seal (App.framework changes after signing), and a
      # downloaded app with a broken seal is reported as "damaged" with no way
      # to open it, so the bundle is re-signed ad-hoc and verified. ditto keeps
      # the .app intact (symlinks, permissions) in the zip; the dmg adds an
      # Applications link for drag-and-drop installation.
      - name: Упаковать dmg и zip
        run: |
          set -euo pipefail
          APP=build/macos/Build/Products/Release/client_vpn.app
          test -x "$APP/Contents/Resources/xray/xray"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/client_vpn.app"
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements "$STAGE/client_vpn.app"
          codesign --verify --deep --strict "$STAGE/client_vpn.app"
          cp LICENSE NOTICE "$STAGE/"
          ditto -c -k "$STAGE" "client-vpn-macos-${PKG_SUFFIX}.zip"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "ClientVPN" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov "client-vpn-macos-${PKG_SUFFIX}.dmg"

      - name: Контрольные суммы
        run: |
          shasum -a 256 "client-vpn-macos-${PKG_SUFFIX}.dmg" \
            "client-vpn-macos-${PKG_SUFFIX}.zip" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: client-vpn-macos-${{ env.PKG_SUFFIX }}
          path: |-
            client-vpn-macos-${{ env.PKG_SUFFIX }}.dmg
            client-vpn-macos-${{ env.PKG_SUFFIX }}.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Публикация GitHub Release
    needs: [android, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh release берёт репозиторий из git-контекста, поэтому без checkout он падает
      # в «failed to run git: not a git repository»
      - uses: actions/checkout@v7

      # в обоих артефактах файл SHA256SUMS.txt называется одинаково, поэтому каждый
      # артефакт скачивается в свой каталог, а сводка для Release считается заново
      - uses: actions/download-artifact@v8
        with:
          name: client-vpn-android-${{ github.ref_name }}
          path: from-android

      - uses: actions/download-artifact@v8
        with:
          name: client-vpn-windows-${{ github.ref_name }}
          path: from-windows

      - uses: actions/download-artifact@v8
        with:
          name: client-vpn-macos-${{ github.ref_name }}
          path: from-macos

      - name: Собрать файлы релиза
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -s "from-android/app-release.apk"
          ls from-windows/"client-vpn-windows-${TAG}.zip" >/dev/null
          ls from-macos/"client-vpn-macos-${TAG}.dmg" from-macos/"client-vpn-macos-${TAG}.zip" >/dev/null
          mkdir dist
          # имена файлов релиза — как в уже опубликованных v0.1.0…v0.3.0; суффикс abi у
          # Android здесь не ставим: CI собирает единый APK на все ABI
          cp from-android/app-release.apk "dist/ClientVPN-${TAG}-Android.apk"
          cp from-windows/"client-vpn-windows-${TAG}.zip" "dist/ClientVPN-${TAG}-Windows-x64.zip"
          cp from-macos/"client-vpn-macos-${TAG}.dmg" "dist/ClientVPN-${TAG}-macOS.dmg"
          cp from-macos/"client-vpn-macos-${TAG}.zip" "dist/ClientVPN-${TAG}-macOS.zip"
          cp from-android/LICENSE from-android/NOTICE dist/
          cd dist
          sha256sum "ClientVPN-${TAG}-Android.apk" "ClientVPN-${TAG}-Windows-x64.zip" \
            "ClientVPN-${TAG}-macOS.dmg" "ClientVPN-${TAG}-macOS.zip" \
            LICENSE NOTICE > SHA256SUMS.txt
          # клиент проверяет пакет по companion-ассету <имя пакета>.sha256, а сводный
          # SHA256SUMS.txt намеренно не читает: без этих двух файлов сверка суммы
          # молча превращается в скачивание без проверки
          sha256sum "ClientVPN-${TAG}-Android.apk" > "ClientVPN-${TAG}-Android.apk.sha256"
          sha256sum "ClientVPN-${TAG}-Windows-x64.zip" > "ClientVPN-${TAG}-Windows-x64.zip.sha256"
          sha256sum "ClientVPN-${TAG}-macOS.dmg" > "ClientVPN-${TAG}-macOS.dmg.sha256"
          sha256sum "ClientVPN-${TAG}-macOS.zip" > "ClientVPN-${TAG}-macOS.zip.sha256"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # тег с дефисом — репетиция или rc: публикуем черновиком, наружу не светим
          case "$TAG" in
            *-*) set -- --draft --prerelease ;;
            *) set -- ;;
          esac
          gh release create "$TAG" "$@" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes dist/*
