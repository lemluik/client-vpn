name: client_vpn
description: КлиентВПН — VPN-клиент на Xray-core (VLESS+Reality)
publish_to: 'none'
version: 0.4.3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  # Direct dependency: the Win32 FFI wrappers (mutex, Job Object) use `calloc`
  # and `Utf16`. The package was already in the graph via flutter_secure_storage.
  ffi: ^2.2.0
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  path: ^1.9.0
  path_provider: ^2.1.1
  shared_preferences: ^2.3.4
  window_manager: ^0.5.2
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  # 1.9.0 is the last line that returns a Flutter ColorScheme: since 2.0.0 (the
  # package CHANGELOG) the palette comes from material_ui with its own scheme
  # type, incompatible with ThemeData in the current Flutter version.
  dynamic_color: 1.9.0
  # 0.8.0: since 0.7.0 the package is built on the native API (nativeapi); the
  # legacy trayManager singleton moved to legacy.dart and is marked for removal.
  tray_manager: 0.7.0
  # gRPC client for the core's StatsService: on desktop the tunnel traffic is
  # visible only in Xray counters (the access log has no bytes). QueryStats
  # messages are encoded by hand, so protoc and the protobuf package are not needed.
  grpc: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # UI strings are generated from lib/l10n according to l10n.yaml.
  generate: true
  assets:
    # Tray icons: the native tray takes them as files, so at startup they are
    # unpacked from the bundle to the temp directory. tray.ico is the colour
    # icon for Windows; tray_macos.png is the monochrome menu bar template.
    - assets/tray/tray.ico
    - assets/tray/tray_macos.png
    # The About screen shows the license files in full, so they ship in the
    # bundle (item U-6: the user must receive LICENSE and NOTICE).
    - LICENSE
    - NOTICE
